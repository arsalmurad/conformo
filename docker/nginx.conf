# Serves packages/ui's static build. A single-page app with no server-side
# routing, so any unmatched path falls back to index.html rather than 404ing
# on a refresh. index.html itself is never cached: the PWA service worker
# (vite-plugin-pwa) is what decides what's safe to serve offline, and it
# reads its own precache manifest from this file, so a stale cached copy of
# THIS file specifically would break "the app updates itself" without a
# clear signal to the user.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
