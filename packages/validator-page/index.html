<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conformo validator</title>
<meta name="description" content="Check whether an e-invoice (XRechnung, ZUGFeRD, Factur-X, Peppol BIS, CII or UBL) will be accepted, against the official rules, entirely in your browser. Nothing is uploaded.">
</head>
<body>
<a class="skip-link" href="#check" data-i18n="skip"></a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="https://conformo-three.vercel.app/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Conformo</span></a>
    <p class="site-tagline" data-i18n="tagline"></p>
    <nav class="site-nav" data-i18n-label="navLabel">
      <a href="https://conformo-three.vercel.app/" data-i18n="navApp"></a>
      <a href="https://conformo-validate.vercel.app/" aria-current="page" data-i18n="navValidator"></a>
      <a href="https://conformo-docs.vercel.app/" data-i18n="navDocs"></a>
      <a href="https://github.com/arsalmurad/conformo">GitHub</a>
    </nav>
    <div class="lang-switch" role="group" data-i18n-label="language">
      <button type="button" lang="de" data-lang="de">DE</button>
      <button type="button" lang="en" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="vp" id="check">
  <div class="vp-intro">
    <h1 data-i18n="title"></h1>
    <p class="vp-lede" data-i18n="lede"></p>
    <p class="vp-trust">
      <span data-i18n="trust"></span>
      <a href="https://conformo-docs.vercel.app/conformance.html" data-i18n="trustLink"></a>
      <span class="vp-trust-sep" aria-hidden="true">·</span>
      <span data-i18n="makeText"></span>
      <a href="https://conformo-three.vercel.app/" data-i18n="makeLink"></a>
    </p>
  </div>

  <div class="vp-grid">
    <section class="vp-input" aria-labelledby="vp-input-title">
      <h2 id="vp-input-title" class="visually-hidden" data-i18n="inputTitle"></h2>
      <div id="dropzone" class="dropzone">
        <p class="dropzone-title" data-i18n="dropTitle"></p>
        <p class="dropzone-formats" data-i18n="dropFormats"></p>
        <label class="btn btn-primary file-picker-button" for="file-input">
          <span data-i18n="choose"></span>
          <input id="file-input" class="file-input-hidden" type="file" accept=".xml,.pdf,application/xml,text/xml,application/pdf">
        </label>
        <p id="file-name" class="file-picker-name" aria-live="polite"></p>
      </div>
      <details class="vp-paste">
        <summary data-i18n="pasteToggle"></summary>
        <label for="xml-input" class="field-label" data-i18n="pasteLabel"></label>
        <textarea id="xml-input" spellcheck="false" rows="8"></textarea>
      </details>
      <div class="vp-options">
        <label for="country" class="field-label" data-i18n="countryLabel"></label>
        <select id="country">
          <option value="" data-i18n="countryDetect"></option>
          <option value="DE" data-i18n="countryDE"></option>
          <option value="FR" data-i18n="countryFR"></option>
        </select>
      </div>
    </section>

    <section class="vp-result" aria-labelledby="result-title" aria-live="polite">
      <div id="result" class="seal seal-idle">
        <div class="seal-mark" aria-hidden="true" id="result-mark">?</div>
        <div class="seal-body">
          <h2 id="result-title" class="seal-title" data-i18n="idleTitle"></h2>
          <p id="result-sub" class="seal-sub" data-i18n="idleSub"></p>
          <ol id="fixes" class="vp-fixes"></ol>
          <details id="tech" class="seal-tech" hidden>
            <summary data-i18n="technical"></summary>
            <div id="tech-body"></div>
          </details>
        </div>
      </div>
    </section>
  </div>
</main>
<footer class="app-footer" data-i18n="footer"></footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
