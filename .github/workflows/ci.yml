name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - name: Fetch pinned third-party artefacts (tools/artefacts.manifest.json; versions + SHA-256 / commit pins)
        run: npm run artefacts:fetch -- --group build,corpora,java
      - name: Compile the validator's rule sets (SEF) and copy the XSDs (gitignored, not committed)
        run: npm run schematron:compile
      - name: Fetch the SaxonJS browser runtime (gitignored, not committed)
        run: npm run saxonjs:fetch
      - run: npm run test
      - name: Build sample and validate against official schemas (all Factur-X/ZUGFeRD profiles)
        run: |
          npm run build:sample
          npm run validate
      - name: Determinism check
        run: |
          npm run build:sample && sha256sum out/invoice.pdf out/invoice-*.pdf > a.txt
          npm run build:sample && sha256sum out/invoice.pdf out/invoice-*.pdf > b.txt
          diff a.txt b.txt || (echo "PDF output is not deterministic" && exit 1)
      - name: Generated files are up to date (EN 16931 coverage, JSON Schema, OpenAPI)
        run: |
          npm run coverage:generate
          npm run schema:generate
          npm run openapi:generate --if-present
          git diff --exit-code docs/EN16931-COVERAGE.md packages/schema/invoice.schema.json docs/openapi.json || (echo "a generated file is stale: run the generate scripts and commit" && exit 1)
      - name: Conformance against the official validators and sample corpora (regenerates docs/CONFORMANCE.md)
        run: |
          npm run conformance -- --strict
          git diff --exit-code docs/CONFORMANCE.md || (echo "docs/CONFORMANCE.md changed: commit the regenerated report" && exit 1)
      - name: Pack smoke test - npm pack every package, install into a fresh project, run every code block in README and docs
        run: npm run pack:smoke
      - name: Bundle sizes (budgets in tools/size-budget.json)
        run: node tools/check-sizes.mjs
      - name: Install Playwright's Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: End-to-end gate - create an invoice through the real UI, assert the downloaded PDF passes tools/validate.py
        run: npm run e2e
      - name: Docs site builds
        run: |
          npm run build:compliance-data
          npm run docs:build
      - name: Compliance matrix in the README regenerates from the dataset
        run: |
          npm run readme:matrix
          git diff --exit-code README.md || (echo "README.md's compliance matrix is out of date - run 'npm run build:compliance-data && npm run readme:matrix' and commit the result" && exit 1)
      - name: Plain-language coverage note matches the compiled artefact
        run: |
          npm run readme:coverage
          git diff --exit-code docs/DEVELOPMENT.md || (echo "docs/DEVELOPMENT.md's coverage line is out of date - run 'npm run readme:coverage' and commit the result" && exit 1)
      - name: Docker image runs and serves the app
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          body=$(curl -s http://localhost:8080/)
          docker compose down
          [ "$code" = "200" ] || (echo "Docker container did not respond with 200" && exit 1)
          echo "$body" | grep -q '<title>Conformo</title>' || (echo "Docker container did not serve the app" && exit 1)
