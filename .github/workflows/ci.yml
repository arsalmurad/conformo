name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - run: pip install factur-x pikepdf lxml saxonche
      - run: npm run typecheck
      - name: Compile the validator's Schematron -> SEF artefacts (gitignored, not committed)
        run: npm run schematron:compile
      - name: Fetch the SaxonJS browser runtime (gitignored, not committed)
        run: npm run saxonjs:fetch
      - run: npm run test
      - name: Build sample and validate against official schemas
        run: |
          npm run build:sample
          python3 tools/validate.py
          python3 tools/pdfa_audit.py
      - name: Determinism check
        run: |
          npm run build:sample && sha256sum out/invoice.pdf > a.txt
          npm run build:sample && sha256sum out/invoice.pdf > b.txt
          diff a.txt b.txt || (echo "PDF output is not deterministic" && exit 1)
      - name: Install Playwright's Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: End-to-end gate  - create an invoice through the real UI, assert the downloaded PDF passes tools/validate.py
        run: npm run e2e
      - name: Docs site builds 
        run: |
          npm run build:compliance-data
          npm run docs:build
      - name: Compliance matrix in the README regenerates from the dataset 
        run: |
          npm run readme:matrix
          git diff --exit-code README.md || (echo "README.md's compliance matrix is out of date - run 'npm run build:compliance-data && npm run readme:matrix' and commit the result" && exit 1)
      - name: Plain-language coverage in the README matches the compiled artefact 
        run: |
          npm run readme:coverage
          git diff --exit-code README.md || (echo "README.md's coverage line is out of date - run 'npm run readme:coverage' and commit the result" && exit 1)
      - name: Docker image runs and serves the app 
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          body=$(curl -s http://localhost:8080/)
          docker compose down
          [ "$code" = "200" ] || (echo "Docker container did not respond with 200" && exit 1)
          echo "$body" | grep -q '<title>Conformo</title>' || (echo "Docker container did not serve the app" && exit 1)
