# Upstream release watcher (docs/UPDATES.md).
#
# Every day this asks each publisher (KoSIT, CEN, OpenPeppol, Maven Central, PyPI, the KSeF docs) for its newest
# release and compares it with the pins in tools/artefacts.manifest.json. A newer release opens an issue. A newer rule
# source (KoSIT configuration + test suite, CEN, Peppol) is also re-pinned on a branch and proposed as a pull request.
#
# Why the gates run here and not in ci.yml: pull requests opened with GITHUB_TOKEN do not trigger other workflows, so
# ci.yml would never run on the update PR. This job therefore runs the gates that depend on the rule sources itself
# (artefacts:fetch, schematron:compile, saxonjs:fetch, test, conformance --strict with the official KoSIT validator)
# and writes the result into the PR. Nothing is ever merged automatically.
#
# All logic lives in tools/check-upstream.mjs, tools/upstream-issues.mjs and tools/upstream-bump.mjs; this file only
# wires them together. Commits are made as the repository owner by tools/upstream-bump.mjs.
name: upstream
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      bumps: ${{ steps.check.outputs.bumps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Compare every pin with its publisher's newest release
        id: check
        run: node tools/check-upstream.mjs --out out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open, de-duplicate and close upstream-update issues
        run: node tools/upstream-issues.mjs out/upstream.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: upstream-check, path: out/upstream.* }

  bump:
    needs: check
    if: needs.check.outputs.bumps != '' && needs.check.outputs.bumps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        unit: ${{ fromJSON(needs.check.outputs.bumps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Re-pin, run the gates, open the update PR (draft "[needs work]" if a gate fails)
        run: node tools/upstream-bump.mjs ${{ matrix.unit }} --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'upstream-gates-${{ matrix.unit }}', path: 'out/upstream-gates/', if-no-files-found: ignore }
