name: Conformo toolchain
description: Node 22, Python 3.12 and Java 17 with caches, then npm ci and the pinned Python packages. Shared by ci.yml and upstream.yml so the two never drift apart.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: '22', cache: npm }
    - uses: actions/setup-python@v5
      with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/requirements.txt }
    # Java only for the official KoSIT validator in the conformance run.
    - uses: actions/setup-java@v4
      with: { distribution: temurin, java-version: '17' }
    - run: npm ci
      shell: bash
    - run: pip install -r tools/requirements.txt
      shell: bash
